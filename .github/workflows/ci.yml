name: CI
# Build and test with sanitizers

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.8.5

      - name: Build
        run: bazel build //...
        env:
          CC: clang
          CXX: clang++

      - name: Test
        run: bazel test //...
        env:
          CC: clang
          CXX: clang++

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.8.5

      - name: Build with sanitizers
        run: bazel build --config=sanitizers //...
        env:
          CC: clang
          CXX: clang++

      - name: Test with sanitizers
        run: bazel test --config=sanitizers //...
        env:
          CC: clang
          CXX: clang++
