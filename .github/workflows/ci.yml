name: CI
# Build and test with sanitizers

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld

      - name: Setup Bazel
        uses: bazelbuild/setup-bazelisk@v3

      - name: Mount Bazel cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel
          key: bazel-${{ runner.os }}-${{ hashFiles('WORKSPACE', '.bazelrc') }}
          restore-keys: |
            bazel-${{ runner.os }}-

      - name: Build
        run: bazel build //...
        env:
          CC: clang
          CXX: clang++

      - name: Test
        run: bazel test //...
        env:
          CC: clang
          CXX: clang++

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld

      - name: Setup Bazel
        uses: bazelbuild/setup-bazelisk@v3

      - name: Mount Bazel cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel
          key: bazel-sanitizers-${{ runner.os }}-${{ hashFiles('WORKSPACE', '.bazelrc') }}
          restore-keys: |
            bazel-sanitizers-${{ runner.os }}-

      - name: Build with sanitizers
        run: bazel build --config=sanitizers //...
        env:
          CC: clang
          CXX: clang++

      - name: Test with sanitizers
        run: bazel test --config=sanitizers //...
        env:
          CC: clang
          CXX: clang++
